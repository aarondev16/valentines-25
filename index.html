<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Valentine's 25</title>
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <p id="noMessage" class="message hidden">¿¡En serio!? 😡</p>
    <div class="image-container">
      <img
        id="questionGif"
        src="./public/wybmv.gif"
        alt="question-gif"
        class="gif"
      />
      <img
        id="emojiGif"
        src="./public/cry.gif"
        alt="cry-emoji"
        class="gif hidden"
      />
      <img
        id="happyGif"
        src="./public/happy.gif"
        alt="happy"
        class="gif hidden"
      />
    </div>
    <div id="buttons">
      <button id="yesBtn" class="button">Sí</button>
      <button id="noBtn" class="button">No</button>
    </div>
    <p id="yesMessage" class="message hidden">Yeii, te amo mucho ❤️</p>
  </body>
</html>
